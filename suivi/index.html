<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Suivi Pro</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#0369a1;--accent-2:#e0f2fe;--danger:#dc2626;--warn:#b45309;--ok:#15803d;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--text:#e5e7eb;--muted:#9ca3af;--line:#263041;--accent:#38bdf8;--accent-2:#0c4a6e;--warn:#fbbf24;--ok:#4ade80;--danger:#f87171}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto}
header h1{flex:1;min-width:0;font-size:18px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);color:var(--text);min-width:40px;height:40px;border-radius:12px;font-size:17px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;padding:0 10px;text-decoration:none;font-weight:600}
main{padding:0 16px;max-width:820px;margin:0 auto}
nav.tabs{display:flex;gap:6px;max-width:820px;margin:0 auto;padding:0 16px 8px;position:sticky;top:60px;z-index:4;background:var(--bg);overflow-x:auto}
nav.tabs button{flex:1;border:0;border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;font-weight:600;background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--accent);color:#fff}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.muted{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:6;cursor:pointer}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.none{color:var(--muted);font-size:14px;padding:4px 0}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:20px!important}}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 2px 4px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;appearance:none;-webkit-appearance:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px;background:var(--line);color:var(--text);text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.soft{background:var(--accent-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:13px}
.menu .btn{text-align:left;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--text);white-space:nowrap;margin-right:4px}
.tag.red{background:#fee2e2;color:#991b1b}.tag.amber{background:#fef3c7;color:#92400e}.tag.green{background:#dcfce7;color:#166534}.tag.blue{background:#e0f2fe;color:#075985}.tag.gray{background:#f3f4f6;color:#4b5563}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;cursor:pointer;background:transparent;color:#fff;font-size:14px;padding:0;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--muted)}
.loading{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-weight:600;text-align:center;padding:20px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.stat.red b{color:var(--danger)}.stat.amber b{color:var(--warn)}
.topic{cursor:pointer}
.topic .head{display:flex;gap:8px;align-items:flex-start}
.topic .title{font-weight:700;flex:1;min-width:0}
.topic .next{margin-top:8px;font-size:14px;display:flex;gap:6px;align-items:baseline}
.topic .meta{margin-top:6px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-top:6px}
/* ligne du temps d'un sujet */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--line)}
.tl .it{position:relative;padding:4px 0 14px}
.tl .it::before{content:'';position:absolute;left:-29px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.tl .it.future::before{border-color:var(--accent);border-style:dashed}
.tl .it.jalon::before{border-radius:3px;transform:rotate(45deg);background:var(--accent);border-color:var(--accent)}
.tl .it.late::before{border-color:var(--danger);background:var(--danger)}
.tl .it.donea::before{background:var(--ok);border-color:var(--ok)}
.tl .it.decision::before{background:#7c3aed;border-color:#7c3aed}
.tl .when{font-size:12px;color:var(--muted)}
.tl .txt{white-space:pre-wrap;font-size:15px}
.tl .now{position:relative;margin:4px 0 14px;font-size:12px;font-weight:700;color:var(--accent)}
.tl .now::before{content:'';position:absolute;left:-30px;top:5px;width:14px;height:4px;background:var(--accent);border-radius:2px}
/* feuille de route */
.rm{overflow-x:auto;-webkit-overflow-scrolling:touch;--nw:150px}
@media (max-width:520px){.rm{--nw:112px}}
.rm-in{position:relative}
.rm-row{display:flex;align-items:center;height:40px;border-bottom:1px solid var(--line)}
.rm-name{position:sticky;left:0;z-index:2;background:var(--card);width:var(--nw);flex:none;font-size:13px;font-weight:600;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rm-track{position:relative;flex:none;height:100%}
.rm-mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid var(--card)}
.rm-mk.j{border-radius:3px;transform:translate(-50%,-50%) rotate(45deg)}
.rm-bar{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;opacity:.35}
.rm-head{display:flex;height:26px;font-size:11px;color:var(--muted)}
.rm-wk{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.rm-wk span{position:absolute;top:4px;left:3px;white-space:nowrap}
.rm-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.found{background:var(--accent-2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px}
.pv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.pv input[type=checkbox]{width:20px;height:20px;appearance:auto;-webkit-appearance:checkbox;padding:0;vertical-align:middle;margin-right:6px}
.pv .li{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:14px}
.search{margin-bottom:10px}
.filters{margin:0 0 10px}
a.lnk{color:var(--accent);word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" data-a="fab" aria-label="Ajouter">+</button>
<div id="layer"></div>
<script>
'use strict';
/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o = {day: 'numeric', month: 'short'}) => s ? pd(s).toLocaleDateString('fr-BE', o) : '';
const rel = s => { if (!s) return ''; const n = daysBetween(today(), s);
  return n === 0 ? 'aujourd\'hui' : n === 1 ? 'demain' : n === -1 ? 'hier' : n > 0 ? (n < 7 ? fmt(s, {weekday: 'long'}) : 'dans ' + n + ' j') : 'il y a ' + (-n) + ' j'; };
const GH_API = 'https://api.github.com', FILE = 'data/suivi.json';
const MODELS = [['claude-sonnet-5', 'Sonnet 5 (précis)'], ['claude-haiku-4-5-20251001', 'Haiku 4.5 (rapide)']];
const STATUS = {actif: ['Actif', 'green'], attente: ['En attente', 'amber'], bloque: ['Bloqué', 'red'], fini: ['Terminé', 'gray']};
const KINDS = {note: ['📝', 'Note'], reunion: ['👥', 'Réunion'], mail: ['✉️', 'E-mail'], decision: ['⚖️', 'Décision'], jalon: ['🎯', 'Jalon / échéance']};
const COLORS = ['#0369a1', '#db2777', '#16a34a', '#ea580c', '#7c3aed', '#0891b2', '#ca8a04', '#64748b', '#dc2626', '#4f46e5'];

/* ---------- données ---------- */
const STORE = 'suivi-pro-v1', CFG = 'suivi-pro-reglages';
const defaults = () => ({topics: [], actions: [], entries: [],
  meta: [{id: 'meta', domains: ['OMNI', 'Supply Chain', 'Invoicing', 'SFS', 'Data & Reporting', 'Autre'], markets: ['BELUX', 'NL', 'AT', 'Tous'], upd: 0}]});
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORE)); if (s?.topics) return {...defaults(), ...s}; } catch (e) {} return defaults(); }
function loadCfg() {
  let c = {}; try { c = JSON.parse(localStorage.getItem(CFG)) || {}; } catch (e) {}
  c = {apiKey: '', model: MODELS[0][0], ghRepo: '', ghToken: '', lastSync: null, readOnly: false, me: 'Olivier', email: '', tab: 'today', fDomain: '', fStatus: 'ouverts', ...c};
  try { // même adresse que l'app Budget : on reprend ses réglages
    const b = JSON.parse(localStorage.getItem('budget-famille-v1'))?.settings;
    if (b) { if (!c.apiKey && b.apiKey) c.apiKey = b.apiKey; if (!c.ghRepo && b.ghRepo && b.ghToken) { c.ghRepo = b.ghRepo; c.ghToken = b.ghToken; } }
  } catch (e) {}
  return c;
}
let state = loadState(), cfg = loadCfg();
const persistCfg = () => localStorage.setItem(CFG, JSON.stringify(cfg));
function save() { localStorage.setItem(STORE, JSON.stringify(state)); scheduleSync(); }
const live = a => a.filter(x => !x.del);
const touch = o => { o.upd = Date.now(); return o; };
const meta = () => state.meta.find(m => m.id === 'meta') || defaults().meta[0];
const topic = id => state.topics.find(t => t.id === id && !t.del);
const topics = () => live(state.topics);
const actionsOf = id => live(state.actions).filter(a => a.topic === id);
const entriesOf = id => live(state.entries).filter(e => e.topic === id);
const openActions = () => live(state.actions).filter(a => !a.done && topic(a.topic) && topic(a.topic).status !== 'fini');
const sortAct = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.created || 0) - (b.created || 0);
const nextAction = id => actionsOf(id).filter(a => !a.done).sort(sortAct)[0];
const lastUpdate = id => { // dernière date d'activité connue d'un sujet
  const t = topic(id), ds = [t?.upd ? iso(new Date(t.upd)) : ''];
  entriesOf(id).forEach(e => { if (e.date <= today()) ds.push(e.date); });
  actionsOf(id).forEach(a => { if (a.doneAt) ds.push(a.doneAt); if (a.created) ds.push(iso(new Date(a.created))); });
  return ds.filter(Boolean).sort().at(-1) || '';
};
const colorOf = t => t?.color || COLORS[Math.abs([...(t?.domain || 'x')].reduce((h, c) => h * 31 + c.charCodeAt(0), 7)) % COLORS.length];
const dueTag = a => {
  if (a.done) return `<span class="tag green">fait ${fmt(a.doneAt)}</span>`;
  if (!a.due) return '';
  const n = daysBetween(today(), a.due);
  return `<span class="tag ${n < 0 ? 'red' : n <= 2 ? 'amber' : 'blue'}">${n < 0 ? 'en retard · ' : ''}${fmt(a.due)} (${rel(a.due)})</span>`;
};

/* ---------- vues ---------- */
let view = {name: 'home'};
function actionRow(a, showTopic = true) {
  const t = topic(a.topic);
  return `<div class="row ${a.done ? 'done' : ''}">
    <button class="chk ${a.done ? 'on' : ''}" data-a="toggle" data-id="${a.id}" aria-label="Fait">${a.done ? '✓' : ''}</button>
    <div class="grow" data-a="action" data-id="${a.id}"><div class="t">${esc(a.text)}</div>
      <div style="margin-top:3px">${dueTag(a)}${a.who ? `<span class="tag amber">⏳ ${esc(a.who)}</span>` : ''}${showTopic && t ? `<span class="tag" style="background:${colorOf(t)}22">${esc(t.title)}</span>` : ''}</div></div>
    ${a.who && !a.done ? `<button class="btn sm soft" data-a="relance" data-id="${a.id}">✉️ Relancer</button>` : ''}</div>`;
}
function todayHTML() {
  const T = today(), open = openActions();
  const late = open.filter(a => a.due && a.due < T && !a.who).sort(sortAct);
  const week = open.filter(a => a.due && a.due >= T && a.due <= addDays(T, 7) && !a.who).sort(sortAct);
  const wait = open.filter(a => a.who).sort(sortAct);
  const active = topics().filter(t => t.status !== 'fini');
  const noNext = active.filter(t => !nextAction(t.id));
  const stale = active.filter(t => { const l = lastUpdate(t.id); return l && daysBetween(l, T) > 14; });
  const jal = live(state.entries).filter(e => e.kind === 'jalon' && !e.done && e.date >= T && e.date <= addDays(T, 30) && topic(e.topic)).sort((a, b) => a.date.localeCompare(b.date));
  const block = (title, list, empty) => `<h2>${title}<span>${list.length || ''}</span></h2><div class="card">${list.length ? list.map(a => actionRow(a)).join('') : `<div class="none">${empty}</div>`}</div>`;
  return `<div class="stats">
      <div class="stat red" data-a="scroll" data-v="late"><b>${late.length}</b><span>en retard</span></div>
      <div class="stat amber" data-a="scroll" data-v="week"><b>${week.length}</b><span>cette semaine</span></div>
      <div class="stat" data-a="scroll" data-v="wait"><b>${wait.length}</b><span>en attente</span></div>
      <div class="stat" data-a="tab" data-v="topics"><b>${active.length}</b><span>sujets actifs</span></div></div>
    ${!topics().length ? `<div class="card" style="margin-top:12px"><b>Pour commencer</b><p class="muted">Crée tes sujets avec le bouton +, ou importe ton Action Tracker Excel : copie ses lignes dans Excel puis <b>+ → Importer depuis Excel</b>. Claude crée les sujets, les actions et l'historique.</p>
      ${!cfg.ghRepo ? '<p class="muted">Sur un nouvel appareil : ⚙️ → coller le code de configuration de l\'app Budget.</p>' : ''}</div>` : ''}
    <div id="late">${block('⚠️ En retard', late, 'Rien en retard 👍')}</div>
    <div id="week">${block('📅 Cette semaine', week, 'Rien de prévu dans les 7 jours')}</div>
    <div id="wait">${block('⏳ En attente d\'autres personnes', wait, 'Personne à relancer')}</div>
    ${jal.length ? `<h2>🎯 Jalons dans les 30 jours</h2><div class="card">${jal.map(e => `<div class="row" data-a="topic" data-id="${e.topic}"><span>🎯</span><div class="grow"><div class="t">${esc(e.text)}</div>
      <div><span class="tag blue">${fmt(e.date)} (${rel(e.date)})</span><span class="tag">${esc(topic(e.topic).title)}</span></div></div></div>`).join('')}</div>` : ''}
    ${noNext.length || stale.length ? `<h2>💤 À réveiller</h2><div class="card">
      ${noNext.map(t => `<div class="row" data-a="topic" data-id="${t.id}"><span class="dot" style="background:${colorOf(t)}"></span><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">Aucune prochaine action définie</div></div></div>`).join('')}
      ${stale.filter(t => !noNext.includes(t)).map(t => `<div class="row" data-a="topic" data-id="${t.id}"><span class="dot" style="background:${colorOf(t)}"></span><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">Rien de neuf depuis ${daysBetween(lastUpdate(t.id), T)} jours</div></div></div>`).join('')}</div>` : ''}`;
}
function topicCard(t) {
  const n = nextAction(t.id), st = STATUS[t.status] || STATUS.actif, acts = actionsOf(t.id), done = acts.filter(a => a.done).length;
  const jal = entriesOf(t.id).filter(e => e.kind === 'jalon' && !e.done && e.date >= today()).sort((a, b) => a.date.localeCompare(b.date))[0];
  return `<div class="card topic" data-a="topic" data-id="${t.id}" style="border-left:5px solid ${colorOf(t)}">
    <div class="head"><div class="title">${esc(t.title)}</div><span class="tag ${st[1]}">${st[0]}</span></div>
    <div class="meta">${[t.domain, t.market, t.people].filter(Boolean).map(esc).join(' · ')}${acts.length ? ` · ${done}/${acts.length} actions faites` : ''} · mis à jour ${rel(lastUpdate(t.id))}</div>
    ${n ? `<div class="next"><span>➡️</span><span><b>${esc(n.text)}</b> ${dueTag(n)}${n.who ? `<span class="tag amber">⏳ ${esc(n.who)}</span>` : ''}</span></div>` : t.status !== 'fini' ? '<div class="next muted">➡️ Pas de prochaine action</div>' : ''}
    ${jal ? `<div class="next"><span>🎯</span><span>${esc(jal.text)} <span class="tag blue">${fmt(jal.date)}</span></span></div>` : ''}</div>`;
}
function topicsHTML() {
  const m = meta(), q = (cfg.q || '').toLowerCase();
  let list = topics().filter(t => (!cfg.fDomain || t.domain === cfg.fDomain) && (cfg.fStatus === 'tous' || (cfg.fStatus === 'ouverts' ? t.status !== 'fini' : t.status === cfg.fStatus)));
  if (q) list = list.filter(t => [t.title, t.desc, t.people, t.domain, t.market, ...actionsOf(t.id).map(a => a.text), ...entriesOf(t.id).map(e => e.text)].join(' ').toLowerCase().includes(q));
  const prio = t => { const n = nextAction(t.id); return n?.due || '9999'; };
  list.sort((a, b) => (a.status === 'fini') - (b.status === 'fini') || prio(a).localeCompare(prio(b)) || a.title.localeCompare(b.title));
  return `<input class="search" id="q" placeholder="🔎 Rechercher un sujet, une action, une note…" value="${esc(cfg.q || '')}" data-c="q">

    ${list.length ? list.map(topicCard).join('') : '<div class="card none">Aucun sujet ici. Crée-en un avec le bouton +.</div>'}`;

// Ligne du temps d'un sujet : passé (notes, décisions, actions faites) et futur (actions à faire, jalons)
function timelineHTML(t) {
  const T = today(), items = [];
  entriesOf(t.id).forEach(e => items.push({date: e.date, kind: e.kind, text: e.text, id: e.id, a: 'entry', done: e.done}));
  actionsOf(t.id).forEach(a => {
    if (a.done) items.push({date: a.doneAt || T, kind: 'donea', text: '✅ ' + a.text, id: a.id, a: 'action'});
    else items.push({date: a.due || '', kind: 'todo', text: a.text + (a.who ? ` (⏳ ${a.who})` : ''), id: a.id, a: 'action'});
  });
  const future = items.filter(i => i.date > T || (i.kind === 'todo') || (i.kind === 'jalon' && !i.done && i.date >= T)).sort((a, b) => (b.date || '9999').localeCompare(a.date || '9999'));
  const past = items.filter(i => !future.includes(i)).sort((a, b) => b.date.localeCompare(a.date));
  const it = i => {
    const late = (i.kind === 'todo' && i.date && i.date < T) || (i.kind === 'jalon' && !i.done && i.date < T);
    const cls = [future.includes(i) ? 'future' : '', i.kind === 'jalon' ? 'jalon' : '', i.kind === 'decision' ? 'decision' : '', i.kind === 'donea' ? 'donea' : '', late ? 'late' : ''].join(' ');
    const k = KINDS[i.kind];
    return `<div class="it ${cls}" data-a="${i.a}" data-id="${i.id}" style="cursor:pointer"><div class="when">${i.date ? cap(fmt(i.date, {weekday: 'short', day: 'numeric', month: 'short', year: i.date.slice(0, 4) !== T.slice(0, 4) ? 'numeric' : undefined})) + ' · ' + rel(i.date) : 'sans date'}${k ? ' · ' + k[0] + ' ' + k[1] : i.kind === 'todo' ? ' · ➡️ Action' : ''}</div>
      <div class="txt">${esc(i.text)}</div></div>`;
  };
  return `<div class="tl">${future.map(it).join('')}<div class="now">AUJOURD'HUI · ${fmt(T, {day: 'numeric', month: 'long'})}</div>${past.map(it).join('') || '<div class="none">Pas encore d\'historique.</div>'}</div>`;
}

// Feuille de route : une ligne par sujet, semaines en colonnes
function roadmapHTML() {
  const T = today(), start = addDays(T, -28 - ((pd(T).getDay() + 6) % 7)), weeks = 17, W = 64, px = W / 7;
  const x = d => daysBetween(start, d) * px;
  const list = topics().filter(t => t.status !== 'fini' && (!cfg.fDomain || t.domain === cfg.fDomain))
    .sort((a, b) => (nextAction(a.id)?.due || '9999').localeCompare(nextAction(b.id)?.due || '9999'));
  const end = addDays(start, weeks * 7);
  let head = '';
  for (let i = 0; i < weeks; i++) { const d = addDays(start, i * 7); head += `<div class="rm-wk" style="left:${i * W}px"><span>${fmt(d, {day: 'numeric', month: 'short'})}</span></div>`; }
  const rows = list.map(t => {
    const mk = [];
    entriesOf(t.id).forEach(e => { if (e.date >= start && e.date <= end) mk.push(e.kind === 'jalon'
      ? `<div class="rm-mk j" data-a="entry" data-id="${e.id}" title="${esc(e.text)} · ${fmt(e.date)}" style="left:${x(e.date)}px;background:${e.done ? 'var(--ok)' : e.date < T ? 'var(--danger)' : colorOf(t)}"></div>`
      : `<div class="rm-mk" data-a="entry" data-id="${e.id}" title="${esc(e.text)} · ${fmt(e.date)}" style="left:${x(e.date)}px;width:8px;height:8px;background:var(--muted)"></div>`); });
    actionsOf(t.id).forEach(a => { const d = a.done ? a.doneAt : a.due; if (!d || d < start || d > end) return;
      mk.push(`<div class="rm-mk" data-a="action" data-id="${a.id}" title="${esc(a.text)} · ${fmt(d)}" style="left:${x(d)}px;background:${a.done ? 'var(--ok)' : d < T ? 'var(--danger)' : a.who ? 'var(--warn)' : colorOf(t)}"></div>`); });
    const dates = [...entriesOf(t.id).map(e => e.date), ...actionsOf(t.id).map(a => a.done ? a.doneAt : a.due)].filter(d => d && d >= start && d <= end).sort();
    const bar = dates.length > 1 ? `<div class="rm-bar" style="left:${x(dates[0])}px;width:${x(dates.at(-1)) - x(dates[0])}px;background:${colorOf(t)}"></div>` : '';
    return `<div class="rm-row"><div class="rm-name" data-a="topic" data-id="${t.id}" title="${esc(t.title)}"><span class="dot" style="background:${colorOf(t)};margin:0 6px 0 0;vertical-align:middle"></span>${esc(t.title)}</div>
      <div class="rm-track" style="width:${weeks * W}px">${bar}${mk.join('')}</div></div>`;
  }).join('');
  const m = meta();
  return `<div class="chips filters">${['', ...m.domains].map(d => `<button class="chip ${cfg.fDomain === d ? 'on' : ''}" data-a="fdom" data-v="${esc(d)}">${d ? esc(d) : 'Tous domaines'}</button>`).join('')}</div>
    <div class="card"><div class="rm" id="rm" data-today="${Math.round(x(T))}"><div class="rm-in" style="width:calc(var(--nw) + ${weeks * W}px)">
      <div class="rm-head"><div class="rm-name" style="font-weight:400;color:var(--muted)">Sujet</div><div class="rm-track" style="width:${weeks * W}px">${head}<div class="rm-today" style="left:${x(T)}px"></div></div></div>
      ${rows || '<div class="none" style="padding:12px 0">Aucun sujet actif.</div>'}
      ${rows ? `<div style="position:absolute;top:26px;bottom:0;left:calc(var(--nw) + ${x(T)}px);width:2px;background:var(--danger);opacity:.6;pointer-events:none"></div>` : ''}</div></div>
    <div class="legend"><span>● action à faire</span><span style="color:var(--danger)">● en retard</span><span style="color:var(--warn)">● en attente</span><span style="color:var(--ok)">● faite</span><span>◆ jalon</span><span>· note</span><span style="color:var(--danger)">| aujourd'hui</span></div>
    <p class="hint">Glisse horizontalement pour voir les semaines. Touche un point pour l'ouvrir.</p></div>`;
}

/* ---------- Claude : e-mails, notes, import Excel ---------- */
async function callClaude(content, maxTokens = 6000) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': cfg.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: cfg.model, max_tokens: maxTokens, messages: [{role: 'user', content}]})});
  if (!res.ok) {
    let msg = res.status === 401 ? 'Clé API invalide.' : res.status === 429 ? 'Trop de requêtes, réessaie dans un instant.' : `Erreur API (${res.status}).`;
    try { const j = await res.json(); if (j.error?.message) msg += ' ' + j.error.message; } catch (e) {}
    throw new Error(msg);
  }
  const j = await res.json(), txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error('La réponse n\'a pas pu être lue.');
  return JSON.parse(m[0]);
}

    const common = `Contexte : ${cfg.me || 'l\'utilisateur'} travaille chez Stellantis BELUX (Network Revenue Management). Date du jour : ${today()}.
Domaines possibles : ${m.domains.join(', ')}. Marchés possibles : ${m.markets.join(', ')}.
Sujets existants (JSON) : ${JSON.stringify(known)}
Règles : dates au format AAAA-MM-JJ ; convertis les dates relatives (« vendredi », « fin de semaine prochaine », « d'ici le 15 ») en dates réelles à partir d'aujourd'hui ; si aucune date n'est donnée, laisse "". Pour "qui" : "" si c'est ${cfg.me || 'l\'utilisateur'} qui doit agir, sinon le prénom (ou nom) de la personne ou de l'équipe qui doit agir. Écris en français, de façon concise et factuelle. N'invente rien qui ne soit pas dans le texte.`;
    const prompt = mode === 'excel' ? `${common}
Voici des lignes copiées d'un fichier Excel de suivi d'actions (colonnes séparées par des tabulations, la première ligne contient probablement les titres). Chaque ligne est un sujet (une « feature » ou un point suivi). Transforme-les en sujets.
Pour chaque ligne : le titre ; le domaine le plus proche (dans la liste) ; le marché si indiqué ; le statut (actif, attente, bloque, fini) ; les personnes ; un contexte court ; les liens (URL) ; la ou les prochaines actions avec échéance et responsable ; l'historique : chaque ligne datée ou élément d'historique devient une entrée datée (type note, reunion, mail ou decision) ; les jalons/deadlines deviennent des entrées type "jalon". Si un sujet existe déjà (même titre ou presque), mets son id dans "id_existant".
Réponds UNIQUEMENT avec ce JSON :
{"sujets":[{"id_existant":"","titre":"","domaine":"","marche":"","statut":"actif","personnes":"","contexte":"","liens":[],"actions":[{"texte":"","echeance":"","qui":""}],"historique":[{"date":"","type":"note","texte":""}]}]}

Lignes Excel :
${text.slice(0, 60000)}`
      : `${common}
Voici un e-mail, un fil de discussion ou des notes de réunion. ${forced ? `Il concerne le sujet d'id "${forced}".` : 'Identifie le ou les sujets concernés parmi les sujets existants ; si aucun ne correspond, propose un nouveau sujet (id_existant vide).'}
Pour chaque sujet concerné : un résumé factuel pour la ligne du temps (ce qui s'est passé, ce qui a été décidé, en 1 à 4 phrases), la date de l'événement (date de l'e-mail ou de la réunion, sinon aujourd'hui), son type (mail, reunion, note ou decision), les actions à faire (qui, échéance), les échéances ou jalons annoncés, et les actions existantes qui semblent terminées d'après le texte.
Réponds UNIQUEMENT avec ce JSON :
{"sujets":[{"id_existant":"","titre":"","domaine":"","marche":"","resume":"","date":"","type":"mail","actions":[{"texte":"","echeance":"","qui":""}],"jalons":[{"texte":"","date":""}]}]}

Texte :
${text.slice(0, 40000)}`;
    const r = await callClaude([{type: 'text', text: prompt}], mode === 'excel' ? 16000 : 5000);
    const list = (r.sujets || []).map(s => ({...s, id_existant: forced || (topic(s.id_existant) ? s.id_existant : ''),
      actions: (s.actions || []).map(a => ({...a, on: true})), jalons: (s.jalons || []).map(j => ({...j, on: true})),
      historique: (s.historique || []).map(h => ({...h, on: true})), on: true}));
    if (!list.length) throw new Error('Claude n\'a rien trouvé à enregistrer dans ce texte.');
    draft = {mode, list}; loading(false); reviewDraft();
  } catch (err) { loading(false); toast(err.message); }
}
const dOk = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : '';
function reviewDraft() {
  const scroll = $('.sheet')?.scrollTop || 0;
  const cb = (path, on) => `<input type="checkbox" data-c="dr" data-p="${path}" ${on ? 'checked' : ''}>`;
  sheet(`<h3>Vérifie avant d'enregistrer <button class="icon-btn" data-a="close">✕</button></h3>
    <p class="muted" style="margin-top:0">Décoche ce que tu ne veux pas garder. Tu pourras tout modifier ensuite.</p>
    ${draft.list.map((s, i) => { const ex = topic(s.id_existant); return `<div class="pv">
      <div>${cb(i, s.on)}<b>${ex ? '🗂️ ' + esc(ex.title) : '🆕 Nouveau sujet : ' + esc(s.titre)}</b> ${!ex ? `<span class="tag">${esc(s.domaine || '')}</span>${s.marche ? `<span class="tag">${esc(s.marche)}</span>` : ''}` : ''}</div>
      ${!ex && s.contexte ? `<div class="muted" style="margin-top:4px">${esc(s.contexte)}</div>` : ''}
      ${s.resume ? `<div class="li"><span>${(KINDS[s.type] || KINDS.note)[0]}</span><span><b>${fmt(dOk(s.date) || today())}</b> — ${esc(s.resume)}</span></div>` : ''}
      ${s.historique.map((h, j) => `<div class="li">${cb(i + '.h.' + j, h.on)}<span>${(KINDS[h.type] || KINDS.note)[0]} <b>${esc(fmt(dOk(h.date)) || '?')}</b> ${esc(h.texte)}</span></div>`).join('')}
      ${s.actions.map((a, j) => `<div class="li">${cb(i + '.a.' + j, a.on)}<span>➡️ ${esc(a.texte)} ${dOk(a.echeance) ? `<span class="tag blue">${fmt(a.echeance)}</span>` : ''}${a.qui ? `<span class="tag amber">⏳ ${esc(a.qui)}</span>` : ''}</span></div>`).join('')}
      ${s.jalons.map((j, k) => `<div class="li">${cb(i + '.j.' + k, j.on)}<span>🎯 ${esc(j.texte)} ${dOk(j.date) ? `<span class="tag blue">${fmt(j.date)}</span>` : ''}</span></div>`).join('')}
    </div>`; }).join('')}
    <button class="btn primary" data-a="draft-save">Enregistrer</button>
    <button class="btn" data-a="close">Annuler</button>`);
  const sh = $('.sheet'); if (sh) sh.scrollTop = scroll;
}
function saveDraft() {
  const m = meta(); let nT = 0, nA = 0, nE = 0, firstId = '';
  for (const s of draft.list) {
    if (!s.on) continue;
    let t = topic(s.id_existant);
    if (!t) {
      t = touch({id: uid(), title: String(s.titre || 'Sans titre').slice(0, 120), domain: m.domains.includes(s.domaine) ? s.domaine : m.domains.at(-1), market: m.markets.includes(s.marche) ? s.marche : '',
        status: STATUS[s.statut] ? s.statut : 'actif', people: s.personnes || '', desc: s.contexte || '', links: (s.liens || []).filter(l => /^https?:/.test(l)), created: Date.now()});
      state.topics.push(t); nT++;
    }
    firstId = firstId || t.id;
    if (s.resume) { state.entries.push(touch({id: uid(), topic: t.id, date: dOk(s.date) || today(), kind: KINDS[s.type] ? s.type : 'note', text: s.resume})); nE++; }
    s.historique.filter(h => h.on && h.texte).forEach(h => { state.entries.push(touch({id: uid(), topic: t.id, date: dOk(h.date) || today(), kind: KINDS[h.type] ? h.type : 'note', text: h.texte})); nE++; });
    s.actions.filter(a => a.on && a.texte).forEach(a => { state.actions.push(touch({id: uid(), topic: t.id, text: a.texte, due: dOk(a.echeance), who: a.qui || '', done: false, created: Date.now()})); nA++; });
    s.jalons.filter(j => j.on && j.texte).forEach(j => { state.entries.push(touch({id: uid(), topic: t.id, date: dOk(j.date) || today(), kind: 'jalon', text: j.texte, done: false})); nE++; });
  }
  save(); closeSheet();
  if (draft.list.filter(s => s.on).length === 1 && firstId) view = {name: 'topic', id: firstId};
  render(); toast(`Enregistré ✓ ${nT ? nT + ' sujet(s), ' : ''}${nA} action(s), ${nE} élément(s) de ligne du temps`); draft = null;
}

/* ---------- relance par e-mail ---------- */
function relance(a) {
  const t = topic(a.topic), since = a.created ? daysBetween(iso(new Date(a.created)), today()) : 0;
  const subject = `Suivi : ${t?.title || ''} — ${a.text}`.slice(0, 150);
  const body = `Bonjour ${a.who},\n\nJe reviens vers toi concernant « ${a.text} » (sujet : ${t?.title || ''})${a.due ? `, prévu pour le ${fmt(a.due, {day: 'numeric', month: 'long'})}` : ''}.\nPeux-tu me dire où on en est${a.due && a.due < today() ? ' et quand je peux compter dessus' : ''} ?\n\nMerci d'avance,\n${cfg.email || cfg.me || ''}`;
  state.entries.push(touch({id: uid(), topic: a.topic, date: today(), kind: 'mail', text: `Relance envoyée à ${a.who} : ${a.text}${since ? ` (ouverte depuis ${since} j)` : ''}`}));
  save(); render();
  location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ---------- export CSV ---------- */
function exportCSV() {
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Sujet', 'Domaine', 'Marché', 'Statut sujet', 'Action', 'Qui', 'Échéance', 'Faite le'].map(q).join(';')];
  live(state.actions).forEach(a => { const t = topic(a.topic); if (!t) return;
    rows.push([t.title, t.domain, t.market, (STATUS[t.status] || [''])[0], a.text, a.who || cfg.me, a.due, a.done ? a.doneAt : ''].map(q).join(';')); });
  const blob = new Blob(['﻿' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'}), el = document.createElement('a');
  el.href = URL.createObjectURL(blob); el.download = `suivi-actions-${today()}.csv`; el.click(); setTimeout(() => URL.revokeObjectURL(el.href), 5000);
}

/* ---------- synchronisation (dépôt privé, fusion élément par élément) ---------- */
function gh(path, opt = {}) {
  return fetch(`${GH_API}/repos/${cfg.ghRepo}${path}`, {cache: 'no-store', ...opt,
    headers: {Authorization: `Bearer ${cfg.ghToken}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opt.headers || {})}});
}
const b64utf8 = str => { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const utf8b64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));
function mergeArr(a = [], b = []) {
  const m = new Map(); [...a, ...b].forEach(x => { const o = m.get(x.id); if (!o || (x.upd || 0) > (o.upd || 0)) m.set(x.id, x); });
  const old = Date.now() - 180 * 864e5;
  return [...m.values()].filter(x => !(x.del && (x.upd || 0) < old)).sort((x, y) => x.id.localeCompare(y.id));
}
const KEYS = ['topics', 'actions', 'entries', 'meta'];
const core = s => JSON.stringify(KEYS.map(k => s[k]));
let syncing = false, syncT = null;
function scheduleSync() { if (!cfg.ghRepo || !cfg.ghToken) return; clearTimeout(syncT); syncT = setTimeout(() => syncNow().catch(e => console.warn(e)), 3000); }
async function syncNow(manual = false) {
  if (!cfg.ghRepo || !cfg.ghToken) { if (manual) toast('Configure la synchronisation dans ⚙️.'); return; }
  if (syncing) return; syncing = true;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const g = await gh(`/contents/${FILE}`);
      if (g.status === 401) throw new Error('Jeton GitHub invalide ou expiré.');
      if (!g.ok && g.status !== 404) throw new Error(`Erreur GitHub (${g.status}).`);
      let remote = null, sha;
      if (g.ok) { const j = await g.json(); sha = j.sha; try { remote = JSON.parse(utf8b64(j.content)); } catch (e) {} }
      const merged = {}; KEYS.forEach(k => merged[k] = mergeArr(state[k], remote?.[k]));
      state = {...state, ...merged}; localStorage.setItem(STORE, JSON.stringify(state));
      if (cfg.readOnly || (remote && core(remote) === core(merged))) break;
      const r = await gh(`/contents/${FILE}`, {method: 'PUT', body: JSON.stringify({message: 'suivi : mise à jour', content: b64utf8(JSON.stringify({v: 1, updated: new Date().toISOString(), ...merged}, null, 1)), ...(sha ? {sha} : {})})});
      if (r.ok) break;
      if (r.status === 403) { cfg.readOnly = true; persistCfg(); break; }
      if (r.status !== 409 && r.status !== 422) throw new Error(`Enregistrement impossible (GitHub ${r.status}).`);
      await sleep(1200);
    }
    cfg.lastSync = new Date().toISOString(); persistCfg();
    if (!$('#layer').innerHTML && document.activeElement?.id !== 'q') render();
    if (manual) toast('Suivi à jour ✓');
  } catch (err) { if (manual) toast(err.message); else console.warn(err); }
  finally { syncing = false; }
}
function applyCode(code) {
  try {
    const j = JSON.parse(atob(String(code).trim().replace(/^PL1-/, '')));
    if (!j.r || !j.t) throw 0;
    cfg.ghRepo = j.r; cfg.ghToken = j.t; if (j.k) cfg.apiKey = j.k; cfg.readOnly = false; persistCfg();
    toast('Code accepté, synchronisation…'); syncNow(true); return true;
  } catch (e) { toast('Code invalide.'); return false; }
}

/* ---------- actions ---------- */
const byId = (arr, id) => state[arr].find(x => x.id === id);
function upsert(arr, id, data) { const o = id ? byId(arr, id) : null; if (o) Object.assign(o, data), touch(o); else state[arr].push(touch({id: uid(), created: Date.now(), ...data})); save(); closeSheet(); render(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'bg') { if (e.target === el) closeSheet(); return; }
  if (a === 'close') return closeSheet();
  if (a === 'fab') return addMenu();
  if (a === 'tab') { cfg.tab = el.dataset.v; persistCfg(); view = {name: 'home'}; render(); return scrollTo(0, 0); }
  if (a === 'scroll') { const t = $('#' + el.dataset.v); if (t) scrollTo({top: t.offsetTop - 110, behavior: 'smooth'}); return; }
  if (a === 'settings') { view = {name: 'settings'}; render(); return scrollTo(0, 0); }
  if (a === 'back') { view = {name: 'home'}; render(); return; }
  if (a === 'sync') return syncNow(true);
  if (a === 'topic') { closeSheet(); view = {name: 'topic', id}; render(); return scrollTo(0, 0); }
  if (a === 'fdom') { cfg.fDomain = el.dataset.v; persistCfg(); return render(); }
  if (a === 'fst') { cfg.fStatus = el.dataset.v; persistCfg(); return render(); }
  if (a === 'new-topic') return topicForm();
  if (a === 'topic-edit') return topicForm(topic(id));
  if (a === 'new-action') { if (!topics().length) return toast('Crée d\'abord un sujet.'); return actionForm({}, id); }
  if (a === 'new-entry') { if (!topics().length) return toast('Crée d\'abord un sujet.'); return entryForm({}, id, 'note'); }
  if (a === 'new-jalon') { if (!topics().length) return toast('Crée d\'abord un sujet.'); return entryForm({}, id, 'jalon'); }
  if (a === 'action') return actionForm(byId('actions', id));
  if (a === 'entry') return entryForm(byId('entries', id));
  if (a === 'paste') return pasteForm(id, 'mail');
  if (a === 'import-xl') return pasteForm('', 'excel');
  if (a === 'analyse') return analyse(el.dataset.v);
  if (a === 'draft-save') return saveDraft();
  if (a === 'quickdue') { $('#fDu').value = addDays(today(), +el.dataset.v); return; }
  if (a === 'toggle') {
    const x = byId('actions', id); x.done = !x.done; x.doneAt = x.done ? today() : ''; touch(x); save(); render();
    if (x.done && !actionsOf(x.topic).some(y => !y.done)) toast('Plus aucune action sur ce sujet : pense à définir la suite ➡️');
    return;
  }
  if (a === 'done-next') { const x = byId('actions', id); x.done = true; x.doneAt = today(); touch(x); save(); render(); return actionForm({}, x.topic); }
  if (a === 'relance') return relance(byId('actions', id));
  if (a === 'save-topic') {
    const t = val('fT'); if (!t) return toast('Donne un titre au sujet.');
    const data = {title: t, domain: val('fD'), market: val('fM'), status: val('fS'), people: val('fP'), desc: val('fDe'), links: val('fL').split(/\s*\n\s*/).filter(l => /^https?:\/\//.test(l))};
    const o = id ? byId('topics', id) : null;
    if (o) { const was = o.status; Object.assign(o, data); touch(o); if (was !== o.status) state.entries.push(touch({id: uid(), topic: o.id, date: today(), kind: 'note', text: `Statut : ${STATUS[was]?.[0] || was} → ${STATUS[o.status][0]}`})); save(); closeSheet(); return render(); }
    const n = touch({id: uid(), created: Date.now(), ...data}); state.topics.push(n);
    state.entries.push(touch({id: uid(), topic: n.id, date: today(), kind: 'note', text: 'Sujet ouvert'}));
    save(); closeSheet(); view = {name: 'topic', id: n.id}; render(); return actionForm({}, n.id);
  }
  if (a === 'del-topic') { if (!confirm('Supprimer ce sujet, ses actions et sa ligne du temps ?')) return; const o = byId('topics', id); o.del = true; touch(o);
    state.actions.forEach(x => { if (x.topic === id) { x.del = true; touch(x); } }); state.entries.forEach(x => { if (x.topic === id) { x.del = true; touch(x); } });
    save(); closeSheet(); view = {name: 'home'}; return render(); }
  if (a === 'save-action') { const t = val('fT'); if (!t) return toast('Décris l\'action.');
    const who = val('fW'); return upsert('actions', id, {topic: val('fTo'), text: t, due: val('fDu'), who: /^(moi|me)$/i.test(who) || who === cfg.me ? '' : who}); }
  if (a === 'del-action') { const o = byId('actions', id); o.del = true; touch(o); save(); closeSheet(); return render(); }
  if (a === 'save-entry') { const t = val('fT'); if (!t) return toast('Écris quelque chose.');
    return upsert('entries', id, {topic: val('fTo'), kind: val('fK'), date: val('fDa') || today(), text: t, done: $('#fDo')?.checked || false}); }
  if (a === 'del-entry') { const o = byId('entries', id); o.del = true; touch(o); save(); closeSheet(); return render(); }
  if (a === 'code-apply') { if (applyCode(val('code'))) { view = {name: 'home'}; render(); } return; }
  if (a === 'cfg-save') {
    const mt = state.meta.find(x => x.id === 'meta') || (state.meta.push({id: 'meta'}), state.meta.at(-1));
    const split = s => s.split(',').map(x => x.trim()).filter(Boolean);
    mt.domains = split(val('sDom')); mt.markets = split(val('sMkt')); touch(mt);
    Object.assign(cfg, {me: val('sMe'), email: val('sMail'), ghRepo: val('repo').replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), ghToken: val('tok'), apiKey: val('key'), model: val('model'), readOnly: false});
    persistCfg(); save(); toast('Réglages enregistrés'); return syncNow(true);
  }
  if (a === 'export-csv') return exportCSV();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.c === 'dr') {
    const p = el.dataset.p.split('.'), s = draft.list[+p[0]];
    if (p.length === 1) s.on = el.checked; else ({a: s.actions, j: s.jalons, h: s.historique})[p[1]][+p[2]].on = el.checked;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.c === 'q') { cfg.q = e.target.value; persistCfg(); const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!cfg.lastSync || Date.now() - new Date(cfg.lastSync) > 60000)) syncNow(); });
if (/^#PL1-/.test(location.hash)) { applyCode(location.hash.slice(1)); history.replaceState(null, '', location.pathname); }

render();
syncNow();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
